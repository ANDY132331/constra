<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Constra – Clocked In</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 390px; height: 844px; overflow: hidden;
    background: #080808; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    color: #fff; position: relative;
  }

  /* Status bar */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px 8px; font-size: 12px; font-weight: 700;
    position: relative; z-index: 10;
    color: rgba(255,255,255,0.9);
  }
  .status-time { font-size: 15px; font-weight: 800; }

  /* Hero - CLOCKED IN (green) */
  .hero {
    position: relative; padding: 16px 20px 22px; overflow: hidden;
    background: linear-gradient(155deg, #003d1a 0%, #001a0a 50%, #080808 100%);
    border-bottom: 1px solid rgba(34,197,94,0.18);
  }
  /* Blueprint grid overlay (green tint) */
  .hero::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(90deg, rgba(34,197,94,0.08) 0px, rgba(34,197,94,0.08) 1px, transparent 1px, transparent 48px),
      repeating-linear-gradient(0deg, rgba(34,197,94,0.08) 0px, rgba(34,197,94,0.08) 1px, transparent 1px, transparent 48px);
  }

  /* Hazard stripe top accent */
  .hazard { height: 3px; background: repeating-linear-gradient(90deg, #22c55e 0px, #22c55e 14px, transparent 14px, transparent 28px); }

  .greeting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; position: relative; z-index: 1; }
  .greeting-label { font-size: 11px; font-weight: 900; color: rgba(34,197,94,0.7); text-transform: uppercase; letter-spacing: 0.14em; }
  .greeting-name { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: -0.3px; }

  /* Live status badge */
  .live-badge {
    display: flex; align-items: center; gap: 6px;
    background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3);
    border-radius: 20px; padding: 4px 10px;
  }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.25); }
  .live-text { font-size: 10px; font-weight: 900; color: #22c55e; text-transform: uppercase; letter-spacing: 0.08em; }

  /* Big timer */
  .timer-block { position: relative; z-index: 1; text-align: center; margin: 8px 0 4px; }
  .timer-value { font-size: 64px; font-weight: 900; color: #fff; letter-spacing: -2px; font-variant-numeric: tabular-nums; line-height: 1; }
  .timer-label { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 4px; }

  /* GPS + project row */
  .location-row {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 8px; margin-top: 12px;
  }
  .gps-badge {
    display: flex; align-items: center; gap: 5px;
    background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.25);
    border-radius: 10px; padding: 5px 10px;
    font-size: 10px; font-weight: 800; color: rgba(34,197,94,0.85); letter-spacing: 0.04em;
  }
  .gps-badge svg { width: 11px; height: 11px; color: #22c55e; }
  .project-pill {
    flex: 1; display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 5px 10px;
    font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.6);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .proj-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; flex-shrink: 0; }

  /* Photo proof card */
  .proof-card {
    margin: 12px 18px; border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(34,197,94,0.2); position: relative;
    background: #111;
  }
  .proof-img {
    width: 100%; height: 120px;
    background: linear-gradient(135deg, #0d1f10 0%, #0a1a0a 100%);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  /* Construction site silhouette */
  .site-silhouette {
    width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 0; overflow: hidden;
  }
  .site-silhouette svg { width: 100%; height: 90px; }
  .proof-overlay {
    position: absolute; top: 8px; left: 8px;
    background: rgba(34,197,94,0.9); border-radius: 8px; padding: 3px 8px;
    font-size: 10px; font-weight: 900; color: #000; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .proof-timestamp {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(0,0,0,0.7); border-radius: 8px; padding: 3px 8px;
    font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.8); font-family: monospace;
  }
  .proof-footer {
    padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid rgba(34,197,94,0.12);
  }
  .proof-footer-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.35); }
  .proof-footer-val { font-size: 11px; font-weight: 800; color: rgba(34,197,94,0.8); }

  /* Stats row */
  .stats-row { display: flex; gap: 8px; margin: 0 18px 12px; }
  .stat-chip {
    flex: 1; background: #131110; border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px; padding: 10px 12px; text-align: center;
  }
  .stat-chip-val { font-size: 18px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
  .stat-chip-label { font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

  /* Clock out button */
  .clockout-btn {
    margin: 0 18px 10px;
    background: rgba(239,68,68,0.12); border: 1.5px solid rgba(239,68,68,0.3);
    border-radius: 16px; padding: 16px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .clockout-btn-icon { width: 22px; height: 22px; color: #f87171; }
  .clockout-btn-label { font-size: 15px; font-weight: 900; color: #f87171; letter-spacing: -0.2px; }

  /* Bottom nav */
  .nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(7,7,7,0.97);
    border-top: 1px solid rgba(245,158,11,0.14);
    box-shadow: 0 -12px 48px rgba(0,0,0,0.75);
    padding: 8px 0 20px;
    display: flex; align-items: flex-end; justify-content: space-around;
    z-index: 100;
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 60px; }
  .nav-icon-wrap { width: 44px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .nav-icon-wrap.active { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.15); }
  .nav-label { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.25); }
  .nav-label.active { color: #f59e0b; }
  .nav-icon { width: 20px; height: 20px; color: rgba(255,255,255,0.25); }
  .nav-icon.active { color: #f59e0b; }
  /* Clock center button - green when clocked in */
  .clock-btn {
    width: 54px; height: 54px; border-radius: 16px;
    background: #22c55e; box-shadow: 0 8px 24px rgba(34,197,94,0.4);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 2px; margin-top: -20px;
  }
  .clock-btn svg { width: 22px; height: 22px; color: #000; }
</style>
</head>
<body>

<!-- Hazard stripe -->
<div class="hazard"></div>

<!-- Status Bar -->
<div class="status-bar">
  <span class="status-time">9:41</span>
  <div style="display:flex;align-items:center;gap:5px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2.5"><path d="M6 20v-6"/><path d="M10 20V10"/><path d="M14 20V4"/><path d="M18 20v-9"/></svg>
    <svg width="22" height="12" viewBox="0 0 22 12" fill="rgba(255,255,255,0.8)"><rect x="0" y="1" width="18" height="10" rx="2" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/><rect x="1.5" y="2.5" width="12" height="7" rx="1" fill="#22c55e"/><path d="M19 4v4a2 2 0 0 0 0-4z"/></svg>
  </div>
</div>

<!-- Hero -->
<div class="hero">
  <div class="greeting-row">
    <div>
      <div class="greeting-label">Currently On Site</div>
      <div class="greeting-name">Marcus Chen</div>
    </div>
    <div class="live-badge">
      <div class="live-dot"></div>
      <span class="live-text">Live</span>
    </div>
  </div>

  <div class="timer-block">
    <div class="timer-value">4:23:17</div>
    <div class="timer-label">Time on site today</div>
  </div>

  <div class="location-row">
    <div class="gps-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      GPS Verified
    </div>
    <div class="project-pill">
      <div class="proj-dot"></div>
      Downtown Office Tower
    </div>
  </div>
</div>

<!-- Photo proof -->
<div class="proof-card">
  <div class="proof-img">
    <div class="site-silhouette">
      <!-- Simple construction site silhouette -->
      <svg viewBox="0 0 390 90" xmlns="http://www.w3.org/2000/svg">
        <!-- Sky gradient -->
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0d2010" stop-opacity="1"/>
            <stop offset="100%" stop-color="#0a1a0a" stop-opacity="1"/>
          </linearGradient>
        </defs>
        <rect width="390" height="90" fill="url(#skyGrad)"/>
        <!-- Building silhouettes -->
        <rect x="20" y="25" width="35" height="65" fill="#0d2a12" rx="2"/>
        <rect x="60" y="10" width="50" height="80" fill="#0f3015" rx="2"/>
        <rect x="115" y="35" width="30" height="55" fill="#0d2a12" rx="2"/>
        <!-- Crane -->
        <line x1="170" y1="90" x2="170" y2="5" stroke="#1a4d1e" stroke-width="4"/>
        <line x1="140" y1="8" x2="210" y2="8" stroke="#1a4d1e" stroke-width="3"/>
        <line x1="170" y1="8" x2="195" y2="25" stroke="#1a4d1e" stroke-width="2" stroke-dasharray="3,3"/>
        <!-- More buildings -->
        <rect x="220" y="40" width="40" height="50" fill="#0d2a12" rx="2"/>
        <rect x="265" y="20" width="55" height="70" fill="#0f3015" rx="2"/>
        <rect x="325" y="50" width="45" height="40" fill="#0d2a12" rx="2"/>
        <!-- Ground -->
        <rect x="0" y="85" width="390" height="5" fill="#0a1a0a"/>
        <!-- Grid overlay -->
        <line x1="0" y1="30" x2="390" y2="30" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
        <line x1="0" y1="60" x2="390" y2="60" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
        <line x1="97" y1="0" x2="97" y2="90" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
        <line x1="194" y1="0" x2="194" y2="90" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
        <line x1="291" y1="0" x2="291" y2="90" stroke="rgba(34,197,94,0.08)" stroke-width="1"/>
      </svg>
    </div>
    <div class="proof-overlay">✓ Photo Proof</div>
    <div class="proof-timestamp">08/06/26 · 05:17 AM</div>
  </div>
  <div class="proof-footer">
    <span class="proof-footer-label">Clocked in at</span>
    <span class="proof-footer-val">5:18 AM · 456 King St W</span>
  </div>
</div>

<!-- Stats row -->
<div class="stats-row">
  <div class="stat-chip">
    <div class="stat-chip-val" style="color:#22c55e;">4.4h</div>
    <div class="stat-chip-label">Today</div>
  </div>
  <div class="stat-chip">
    <div class="stat-chip-val">38.2h</div>
    <div class="stat-chip-label">This Week</div>
  </div>
  <div class="stat-chip">
    <div class="stat-chip-val">22</div>
    <div class="stat-chip-label">Days In</div>
  </div>
</div>

<!-- Clock Out CTA -->
<div class="clockout-btn">
  <svg class="clockout-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
  <span class="clockout-btn-label">Clock Out</span>
</div>

<!-- Bottom Nav -->
<nav class="nav">
  <!-- Home -->
  <div class="nav-item">
    <div class="nav-icon-wrap">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
    </div>
    <span class="nav-label">Home</span>
  </div>
  <!-- Schedule -->
  <div class="nav-item">
    <div class="nav-icon-wrap">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </div>
    <span class="nav-label">Schedule</span>
  </div>
  <!-- Clock center — GREEN (clocked in) -->
  <div class="nav-item">
    <div class="clock-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
    </div>
    <span class="nav-label" style="color:rgba(34,197,94,0.7);">Clock</span>
  </div>
  <!-- Projects -->
  <div class="nav-item">
    <div class="nav-icon-wrap">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    </div>
    <span class="nav-label">Projects</span>
  </div>
  <!-- Chat -->
  <div class="nav-item">
    <div class="nav-icon-wrap">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <span class="nav-label">Chat</span>
  </div>
</nav>

</body>
</html>
